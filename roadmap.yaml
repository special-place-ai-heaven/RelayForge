schema: frutlups.roadmap/2
project: relayforge
brief: 00_brief/
verification:
  full: [python, -B, scripts/hermetic_verification.py]
  focused_default:
    - [python, -B, scripts/roadmap.py, check]
  observation: process
  timeout_seconds: 900
allowed_prefixes: [02_analysis/, 07_app/, 08_pkg/, Cargo.toml, Cargo.lock, rust-toolchain.toml, scripts/canary_verify.py, scripts/product_verify.py, scripts/ci_contract_check.py, .github/workflows/, docs/ci.md]
forbidden:
  - 00_brief/
  - 05_governance/
  - prompts/
  - questions/answered/
  - roadmap.yaml
  - frutlups.toml
  - AGENTS.md
  - CLAUDE.md
review:
  ordinary: [reviewer]
  high: [claude_reviewer]
  release: [reviewer, claude_reviewer]
milestones:
  - id: M001
    title: Native foundation contract and toolchain admission
    status: active
    risk: ordinary
    holistic_review: true
    slices:
      - id: M001-S01
        title: Freeze the native foundation contract
        objective: >
          Specify the smallest non-Python core and adapter contracts before
          admitting a disposable exact-toolchain product canary.
        acceptance:
          - Define inventory, route, observation, outcome and reconciliation contracts.
          - Separate capability facts from measured model-effort-difficulty statistics.
          - Include tool-call failures, recovery cost, uncertainty and crash recovery.
          - Compare at most two non-Python toolchains; keep the final decision explicit.
          - Name the canary, full-check and test-discovery gates for later admission.
        non_goals:
          - Product code, dependencies, hooks, services or paid model evaluations.
          - Changing canonical decisions, foreground models or harness configuration.
        read_first:
          - 00_brief/CONTEXT.md
          - 00_brief/intake.md
          - 00_brief/constraints.md
          - 00_brief/decisions.md
          - 02_analysis/CONTEXT.md
          - 02_analysis/foundation-brief.md
          - 02_analysis/actionable-findings.md
        allowed_prefixes: [02_analysis/foundation-contract.md]
        focused:
          - [python, -B, scripts/roadmap.py, check]
        kind: docs
  - id: M002
    title: Exact Rust and SQLite canary admission
    status: active
    risk: ordinary
    holistic_review: true
    slices:
      - id: M002-S01
        title: Define the executable canary and release decomposition
        objective: >
          Turn selected Rust 1.99.1 and SQLite into an exact bounded canary
          plan and map release gates to subsequent implementation slices.
        acceptance:
          - Specify pinned toolchain, SQLite binding selection evidence and isolated workspace.
          - Specify exact build, test discovery, full verification and crash/replay checks.
          - Map release gates G1-G6 to ordered implementation slices with observable acceptance.
          - Identify architect-owned verifier/runtime setup before issuing product prompts.
          - State next executable admission and continue campaign after plan acceptance.
          - Carry D012 distribution gate into packaging plans; continue independent implementation while Q001 is open.
        non_goals:
          - Product implementation or paid provider calls within this planning slice.
          - Reopening accepted foundation work or changing release completion criteria.
        read_first:
          - 00_brief/CONTEXT.md
          - 00_brief/constraints.md
          - 00_brief/decisions.md
          - 00_brief/release-contract.md
          - 02_analysis/foundation-contract.md
          - docs/project_checks.md
          - questions/open/Q001-template-distribution-permission.md
        allowed_prefixes: [02_analysis/canary-plan.md]
        focused:
          - [python, -B, scripts/roadmap.py, check]
        kind: docs
      - id: M002-S02
        title: Qualify native event durability and recovery
        objective: >
          Implement and execute the disposable Rust 1.99.1 and bundled SQLite
          canary from the accepted plan before admitting reusable product code.
        acceptance:
          - Retain a self-contained library and relayforge canary CLI under 08_pkg/canary with Rust 1.99.1 pin, PolyForm metadata and complete Cargo.lock; use rusqlite exactly 0.40.0 with bundled SQLite 3.53.1.
          - Prove toolchain and target versions, locked dependency graph, formatting, warning-free Clippy, all-target build, nonempty discovered and executed unit/integration tests and doctests where declared; all checks offline after explicit dependency provisioning.
          - The maintained scripts/canary_verify.py command must fail closed on missing, zero, skipped or failed required tests and include negative self-checks of those guards.
          - Materialize the exact candidate Git tree in an isolated clean source directory using an alternate index without changing the real index or HEAD; retain tree and blob identities and execute the maintained full verifier there without recursion.
          - Use separate temporary output/database directories and fresh CLI processes to seed records, abort after committed intent, reconcile twice without duplicates, and append failure then verification then acceptance while preserving unknown identity/cost and original failure history.
          - Tests prove completion requires both verification and acceptance, capability facts are distinct from observations, duplicate events do not inflate counts, and runtime SQLite is 3.53.1 with bundled feature evidence.
          - Verify source/index/HEAD remain unchanged by full verification; bounded scratch cleanup never deletes outside owned scratch; enforce per-process timeouts within the 900-second full check.
          - Record portable canary evidence in 02_analysis/canary-results.md including commands, versions, counts, crash exit, snapshot and replay assertions; no secrets, private transcripts, raw runtime stores or machine paths.
        non_goals:
          - Native adapters, real model or tool dispatch, provider calls, packaging, installation or publication.
          - Reusing canary as a finished product or claiming G1-G6 release completion.
        read_first:
          - 08_pkg/CONTEXT.md
          - 02_analysis/CONTEXT.md
          - 00_brief/decisions.md
          - 00_brief/release-contract.md
          - 02_analysis/foundation-contract.md
          - 02_analysis/canary-plan.md
          - docs/project_checks.md
          - scripts/hermetic_verification.py
          - questions/open/Q001-template-distribution-permission.md
        allowed_prefixes: [08_pkg/canary/, scripts/canary_verify.py, 02_analysis/canary-results.md]
        focused:
          - [python, -B, scripts/canary_verify.py, --self-test]
        kind: code
  - id: M003
    title: Durable native metadata core and CLI
    status: active
    risk: ordinary
    holistic_review: true
    slices:
      - id: M003-S01
        title: Implement durable typed events and explicit recovery
        objective: >
          Deliver the separate Rust library and CLI metadata path specified in
          native-core-plan.md, proving durable intent, ownership and recovery.
        acceptance:
          - Implement all metadata, persistence, ownership, recovery and CLI contracts in 02_analysis/native-core-plan.md; use closed bounded versioned types and no raw payload maps.
          - Pin Rust 1.99.1, rusqlite 0.40.0 with bundled SQLite 3.53.1, serde 1.0.228 and serde_json 1.0.154; track root lockfile and exclude the canary from the product workspace.
          - Prove immutable transactional append, parent/scope validation, identical replay no-op and conflicting duplicate refusal without writes; reject unsupported schema versions safely.
          - Prove committed-before-return intents, crash before and after commit, explicit attributed recovery, active-session protection, repeatable reconciliation and linked late results using fresh processes.
          - Race two processes for one session claim and observe exactly one owner; no implicit expiry or takeover. Completion requires all current required checks plus explicit acceptance.
          - Preserve every physical attempt, predecessor/repair link, failure, selected versus observed identity and unknown cost/usage component for later honest accounting.
          - Reject sensitive or raw input before persistence without echoing it; verify synthetic sensitive values absent from database/WAL and stdout/stderr.
          - Exercise actual built CLI init, bounded JSON append/show and reconcile across process boundaries, including failed tool result and verification/acceptance; document usable examples.
          - Full verifier materializes once and executes canary plus product offline with fmt, Clippy, build and nonempty required discovered/executed tests; fail on missing/skipped tests and retain candidate identities and source/index/HEAD invariance.
          - Record portable observations and historical receipt references in 02_analysis/native-core-results.md; make no packaging, adapter, routing or G1-G6 completion claim.
        non_goals:
          - Model/tool dispatch, inventory ranking, providers, harness hooks, packaging or installation.
          - Rewriting accepted canary evidence, importing the community harness or adding unapproved direct dependencies.
        read_first:
          - 08_pkg/CONTEXT.md
          - 07_app/CONTEXT.md
          - 02_analysis/CONTEXT.md
          - 00_brief/decisions.md
          - 00_brief/release-contract.md
          - 02_analysis/native-core-plan.md
          - 02_analysis/foundation-contract.md
          - scripts/canary_verify.py
          - scripts/hermetic_verification.py
          - docs/project_checks.md
        allowed_prefixes: [08_pkg/relayforge-core/, 07_app/relayforge-cli/, Cargo.toml, Cargo.lock, rust-toolchain.toml, scripts/product_verify.py, scripts/canary_verify.py, 02_analysis/native-core-results.md]
        focused:
          - [python, -B, scripts/product_verify.py, --focused]
        kind: code
  - id: M004
    title: CI configuration and observed platform qualification
    status: active
    risk: ordinary
    holistic_review: true
    slices:
      - id: M004-S01
        title: Add portable checks and the requested runner workflow
        objective: Implement the bounded CI mechanisms and trust gates in ci-plan.md, preserving accepted core behavior.
        acceptance:
          - Implement the workflow and verifier contracts in 02_analysis/ci-plan.md with no product schema or domain-logic change.
          - Windows full checks use windows-latest; five useful Linux stages use self-hosted linux/fresh with max-parallel 5 and native target evidence.
          - Reject public fork execution on custom runners; preserve read-only permissions, immutable action pins, full Git ancestry and job timeouts.
          - Maintain explicit fmt, Clippy, unit, integration/CLI and doc stages with actual CLI builds and nonempty discovered/executed required tests; retain all Windows assertions.
          - Deterministic workflow-contract checks and negative fixtures reject unsafe runner, permission, action-pin, ancestry and trust-gate changes; include them in full verification.
          - Local Windows full verification remains clean-candidate, pinned, offline and source/index/HEAD-stable; record portable evidence and documented CI commands/limits.
          - Do not claim Linux or GitHub-hosted qualification before actual CI runs; preserve missing runner/access evidence for S02.
        non_goals:
          - Product domain changes, new product dependencies, packaging, provider calls or host/service reconfiguration.
        read_first:
          - 02_analysis/CONTEXT.md
          - 00_brief/decisions.md
          - 00_brief/release-contract.md
          - 02_analysis/ci-plan.md
          - scripts/product_verify.py
          - scripts/canary_verify.py
          - scripts/hermetic_verification.py
          - 08_pkg/relayforge-core/tests/storage_contract.rs
          - rust-toolchain.toml
          - 08_pkg/canary/rust-toolchain.toml
          - pyproject.toml
        allowed_prefixes: [.github/workflows/, scripts/product_verify.py, scripts/canary_verify.py, scripts/ci_contract_check.py, 08_pkg/relayforge-core/tests/storage_contract.rs, rust-toolchain.toml, 08_pkg/canary/rust-toolchain.toml, docs/ci.md, 02_analysis/ci-results.md]
        focused:
          - [python, -B, scripts/ci_contract_check.py]
          - [python, -B, scripts/product_verify.py, --focused]
        kind: code
      - id: M004-S02
        title: Record actual hosted Windows and fresh Linux qualification
        objective: Qualify the reviewed CI configuration using real runs of the committed source revision.
        acceptance:
          - Record run URLs, exact source revision, host/target/tool versions and per-job conclusions for Windows full and all five Linux stages.
          - Verify public fork versus trusted-source runner gating from actual workflow configuration and executed event context.
          - Report unavailable runners, authentication, divergence or failures honestly with actor/action evidence; never infer Linux success from configuration.
          - Use only sanitized results; keep raw logs, stores, caches and build output untracked and retain Q001 packaging gate.
        non_goals:
          - Modifying workflows or product code in this evidence-only slice; hiding failed jobs or changing runner policy.
        read_first:
          - 02_analysis/CONTEXT.md
          - 00_brief/decisions.md
          - 02_analysis/ci-plan.md
          - docs/ci.md
          - .github/workflows/ci.yml
        allowed_prefixes: [02_analysis/ci-qualification.md]
        focused:
          - [python, -B, scripts/ci_contract_check.py]
        kind: docs
ruled_out:
  - id: R1
    text: Python product runtime; Python remains template workflow tooling only.
  - id: R2
    text: Autonomous runner, live hooks, paid benchmarking or publication in initialization.
not_yet_specified:
  - id: N1
    text: M002 qualified Rust 1.99.1 and SQLite; M003 admits the separate native core and CLI.
  - id: N2
    text: Real native harness event payload coverage and dispatch verification.
  - id: N3
    text: Model-effort crossovers, calibrated routing thresholds and evaluation budgets.
  - id: N4
    text: D011 selects PolyForm Noncommercial 1.0.0 for original RelayForge work; later external-code reuse still requires license and attribution review.
