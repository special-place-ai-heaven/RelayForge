[workspace]
members = ["08_pkg/relayforge-core", "07_app/relayforge-cli"]
exclude = ["08_pkg/canary"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.0", features = ["bundled"] }
