[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relayforge-workflow"
version = "0.1.0"
description = "RelayForge development workflow from agentic-project-template-v4"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7"]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
