name: CI

on:
  push:
    branches: [main, "campaign/**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Provision job-local tools and locked sources
        shell: pwsh
        env:
          RUSTUP_HOME: ${{ runner.temp }}/relayforge-rustup
          CARGO_HOME: ${{ runner.temp }}/relayforge-cargo
        run: |
          python -m venv "$env:RUNNER_TEMP/relayforge-python"
          & "$env:RUNNER_TEMP/relayforge-python/Scripts/python.exe" -m pip install "PyYAML==6.0.3"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          $nativeTarget = (rustc +1.99.1 -vV | Select-String '^host: ').ToString().Split()[1]
          cargo +1.99.1 fetch --manifest-path Cargo.toml --locked --target $nativeTarget
          cargo +1.99.1 fetch --manifest-path 08_pkg/canary/Cargo.toml --locked --target $nativeTarget
      - name: Full clean-candidate verification
        shell: pwsh
        env:
          RUSTUP_HOME: ${{ runner.temp }}/relayforge-rustup
          CARGO_HOME: ${{ runner.temp }}/relayforge-cargo
          GIT_AUTHOR_NAME: special-place-administrator
          GIT_AUTHOR_EMAIL: administrator@special-place.online
          GIT_COMMITTER_NAME: special-place-administrator
          GIT_COMMITTER_EMAIL: administrator@special-place.online
        run: |
          & "$env:RUNNER_TEMP/relayforge-python/Scripts/python.exe" -B scripts/hermetic_verification.py

  linux:
    if: >-
      github.repository == 'special-place-ai-heaven/RelayForge' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))
    runs-on: [self-hosted, linux, fresh]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        stage: [fmt, clippy, unit, integration, doc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Provision job-local Rust and locked sources
        shell: bash
        env:
          RUSTUP_HOME: ${{ runner.temp }}/relayforge-rustup
          CARGO_HOME: ${{ runner.temp }}/relayforge-cargo
        run: |
          set -euo pipefail
          python3 --version
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          native_target="$(rustc +1.99.1 -vV | sed -n 's/^host: //p')"
          test -n "$native_target"
          cargo +1.99.1 fetch --manifest-path Cargo.toml --locked --target "$native_target"
      - name: Verify ${{ matrix.stage }}
        shell: bash
        env:
          RUSTUP_HOME: ${{ runner.temp }}/relayforge-rustup
          CARGO_HOME: ${{ runner.temp }}/relayforge-cargo
        run: python3 -B scripts/product_verify.py --stage "${{ matrix.stage }}"
